name: API CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: api-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mongodb:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: testing
      APP_KEY: base64:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      DB_CONNECTION: mongodb
      DB_URI: mongodb://127.0.0.1:27017
      DB_DATABASE: tap_admission_ci
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      BOOTSTRAP_ADMIN_NAME: Administrador de CI
      BOOTSTRAP_ADMIN_EMAIL: bootstrap-admin@example.test
      BOOTSTRAP_ADMIN_PASSWORD: BootstrapAdmin123!

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, mongodb, dom, fileinfo, gd, zip
          coverage: none

      - name: Validate Composer files
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Check code style
        run: vendor/bin/pint --test

      - name: Generate OpenAPI document
        run: php artisan l5-swagger:generate

      - name: Run tests
        run: php artisan test
